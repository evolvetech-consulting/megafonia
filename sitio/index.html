<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning</title>
<meta name="description" content="Planning del equipo de audiovisuales">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16222D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style id="css">
:root{
  --papel:#EEF2F5; --panel:#FFFFFF; --panel2:#F6FAFB; --linea:#D2DDE4;
  --tinta:#16222D; --suave:#5D7383; --tenue:#8698A5;
  --acento:#0B6E8A; --acento-tinta:#FFFFFF; --acento-suave:#E0EFF3;
  --ok:#1B7357; --alerta:#B65418;
  --peligro:#A93A55;
  --sombra:0 1px 2px rgba(22,34,45,.06), 0 8px 24px -16px rgba(22,34,45,.28);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#0F1920; --panel:#18242E; --panel2:#1D2B36; --linea:#2B3D4A;
    --tinta:#E7EFF4; --suave:#93A9B7; --tenue:#6F8493;
    --acento:#4CB7D4; --acento-tinta:#08222B; --acento-suave:#123641;
    --ok:#4FBE96; --alerta:#E28B4A;
    --peligro:#E37E95;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --papel:#0F1920; --panel:#18242E; --panel2:#1D2B36; --linea:#2B3D4A;
  --tinta:#E7EFF4; --suave:#93A9B7; --tenue:#6F8493;
  --acento:#4CB7D4; --acento-tinta:#08222B; --acento-suave:#123641;
  --ok:#4FBE96; --alerta:#E28B4A;
  --peligro:#E37E95;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box; min-width:0}
/* Nada debe empujar la página a lo ancho: lo que no entre, que se acomode
   o scrollee en su propia caja. `clip` en vez de `hidden` para no romper
   la cabecera pegajosa. */
html, body{overflow-x:clip; max-width:100%}
body{
  margin:0; background:var(--papel); color:var(--tinta);
  font:400 15px/1.5 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,"Helvetica Neue",Arial,sans-serif; margin:0; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--acento); outline-offset:2px; border-radius:4px}

/* ── Cabecera ─────────────────────────────────────────── */
.tope{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--linea);
  /* Abierta como app en el iPhone, la página arranca pegada al borde de arriba
     y el título quedaba tapado por el reloj. El panel se estira por debajo de
     la barra de estado y empuja el contenido a la zona segura. */
  padding-top:env(safe-area-inset-top);
}
.tope-fila{
  max-width:100%; width:1180px; margin:0 auto;
  padding:14px calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.marca{display:flex; align-items:center; gap:10px; margin-right:auto}
.marca h1{font-size:17px; font-weight:700; letter-spacing:-.01em}
.marca .sub{
  font:500 10px/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--tenue); margin-top:3px;
}
.marca .logo{display:block; width:30px; height:30px; flex:none}
.rotulo-equipo{min-width:0}
#sel-equipo{
  background:none; border:1px solid transparent; border-radius:8px;
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif; font-size:17px; font-weight:700;
  letter-spacing:-.01em; color:var(--tinta); padding:2px 26px 2px 6px; margin-left:-6px;
  cursor:pointer; appearance:none; max-width:min(58vw,300px);
  text-overflow:ellipsis; white-space:nowrap; overflow:hidden;
  background-image:linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
                   linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:calc(100% - 13px) 56%, calc(100% - 9px) 56%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
}
#sel-equipo:hover{border-color:var(--linea); background-color:var(--panel2)}
#sel-equipo option{background:var(--panel); color:var(--tinta); font-size:14px; font-weight:400}
.fila-equipo{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.nombre-equipo{
  flex:1; min-width:160px; background:var(--panel2); border:1px solid var(--linea);
  border-radius:var(--r); padding:9px 12px; font-weight:500; font-size:15px;
}
.nombre-equipo:focus{border-color:var(--acento)}
.marca .logo svg{display:block; width:100%; height:100%}

.mes-nav{display:flex; align-items:center; gap:2px; background:var(--panel2);
  border:1px solid var(--linea); border-radius:var(--r); padding:3px}
.mes-nav button{
  background:none; border:0; cursor:pointer; color:var(--suave);
  padding:5px 9px; border-radius:7px; line-height:1; font-size:15px;
}
.mes-nav button:hover{background:var(--panel); color:var(--tinta)}
.mes-nav .etiqueta{
  font:600 13px/1 "IBM Plex Mono",monospace; padding:0 8px;
  min-width:112px; text-align:center; text-transform:capitalize;
}

.acciones{display:flex; gap:8px; align-items:center}
.btn{
  background:var(--panel2); border:1px solid var(--linea); color:var(--tinta);
  padding:8px 14px; border-radius:var(--r); cursor:pointer; font-weight:500;
  font-size:14px; white-space:nowrap; transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--panel); border-color:var(--tenue)}
.btn.primario{background:var(--acento); border-color:var(--acento); color:var(--acento-tinta)}
.btn.primario:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
label.btn{display:inline-block; line-height:1.5}
.btn.primario:disabled:hover{filter:none}

.estado-guardado{
  font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.06em;
  text-transform:uppercase; color:var(--tenue); display:flex; align-items:center; gap:6px;
}
.estado-guardado::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ok)}
.estado-guardado.sucio{color:var(--alerta)}
.estado-guardado.sucio::before{background:var(--alerta)}

/* ── Pestañas ─────────────────────────────────────────── */
.pestanas{max-width:100%; width:1180px; margin:0 auto; padding:0 20px;
  display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 4px; margin-right:20px; color:var(--suave); font-weight:500;
  font-size:14px; transition:color .12s;
}
.pestanas button:hover{color:var(--tinta)}
.pestanas button[aria-selected="true"]{color:var(--acento); border-bottom-color:var(--acento)}

main{
  max-width:100%; width:1180px; margin:0 auto;
  padding:24px calc(20px + env(safe-area-inset-right))
          calc(260px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
}
.vista[hidden]{display:none}

/* ── Tarjetas de fecha ────────────────────────────────── */
.rejilla{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.fecha{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r); box-shadow:var(--sombra); overflow:hidden;
}
.fecha-tope{
  display:flex; align-items:baseline; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--linea); background:var(--panel2);
}
.fecha-tope .dia{font-family:Archivo; font-weight:600; font-size:15px}
.fecha-tope .num{
  font:600 20px/1 "IBM Plex Mono",monospace; color:var(--acento);
  font-variant-numeric:tabular-nums; margin-left:auto;
}
.puesto{
  display:grid; grid-template-columns:minmax(96px,auto) 1fr; align-items:center;
  gap:10px; padding:7px 16px; border-bottom:1px solid var(--linea);
}
.puesto:last-child{border-bottom:0}
.puesto-nom{
  display:flex; align-items:center; gap:7px;
  font:500 10px/1.3 "IBM Plex Mono",monospace; letter-spacing:.09em;
  text-transform:uppercase; color:var(--suave); min-width:0;
}
.puesto-nom .texto{overflow-wrap:anywhere}
.punto{width:7px; height:7px; border-radius:2px; flex:none}
.slots{display:flex; flex-direction:column; gap:5px; min-width:0}
/* Ámbar: está asignado un día que anotaste que no puede. No es un error de
   la app, es alguien a quien hay que reemplazar. Distinto del rojo, que sí
   es imposible: la misma persona en dos puestos a la vez. */
select.asig.ausente{
  border-color:color-mix(in srgb, var(--alerta) 60%, transparent);
  background-color:color-mix(in srgb, var(--alerta) 10%, transparent);
  color:var(--alerta); font-weight:500;
}
select.asig.ausente:hover{background-color:color-mix(in srgb, var(--alerta) 16%, transparent)}
select.asig{
  width:100%; background:transparent; border:1px solid transparent;
  border-radius:7px; padding:5px 7px; cursor:pointer; font-size:14px;
  appearance:none; text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
                   linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%, calc(100% - 8px) 52%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat; padding-right:26px;
}
select.asig:hover{border-color:var(--linea); background-color:var(--panel2)}
select.asig.vacio{color:var(--tenue); font-style:italic}
select.asig option{background:var(--panel); color:var(--tinta); font-style:normal}

/* ── Disponibilidad del mes ───────────────────────────── */
.tarjeta.disponibilidad{border-left:3px solid var(--acento)}
.reglas{display:flex; flex-wrap:wrap; gap:7px; margin-top:15px}
.regla{
  display:inline-flex; align-items:center; gap:3px; background:var(--acento-suave);
  border:1px solid color-mix(in srgb, var(--acento) 35%, transparent);
  border-radius:20px; padding:5px 6px 5px 13px; font-size:13px;
}
.regla b{font-weight:500; color:var(--acento)}
.regla .quitar{
  background:none; border:0; cursor:pointer; color:var(--acento); opacity:.6;
  padding:2px 6px; border-radius:50%; font-size:12px; line-height:1;
}
.regla .quitar:hover{opacity:1; background:color-mix(in srgb, var(--acento) 18%, transparent)}
.fila-mano{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px}
.fila-mano select, .fila-mano input{
  background:var(--panel2); border:1px solid var(--linea); color:var(--tinta);
  border-radius:8px; padding:7px 10px; font-size:14px;
}
.fila-mano select{cursor:pointer}
.fila-mano input{width:110px}
.fila-mano select:focus, .fila-mano input:focus{border-color:var(--acento)}
.aviso.doble li .porque{color:var(--suave)}

/* ── Reparto ──────────────────────────────────────────── */
.tarjeta{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r);
  box-shadow:var(--sombra); padding:18px 20px; margin-top:22px;
}
.tarjeta h2{
  font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--suave); margin-bottom:14px;
}
.reparto{display:grid; gap:7px; grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.reparto-fila{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px}
.reparto-fila .quien{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.barra{display:flex; align-items:center; gap:2px}
.barra i{width:9px; height:9px; border-radius:2px; background:var(--acento)}
.barra b{
  font:500 12px/1 "IBM Plex Mono",monospace; color:var(--tenue);
  margin-left:5px; font-variant-numeric:tabular-nums;
}

/* ── Equipo ───────────────────────────────────────────── */
.persona{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r);
  padding:13px 16px; margin-bottom:9px; display:grid; gap:11px;
  grid-template-columns:minmax(150px,1.1fr) auto auto; align-items:center;
}
.persona .contacto{
  grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap;
  border-top:1px solid var(--linea); padding-top:10px; margin-top:-1px;
}
.persona .dato{
  flex:1; min-width:150px; background:transparent; border:1px solid transparent;
  border-radius:7px; padding:6px 9px; font-size:13.5px; color:var(--suave);
}
.persona .dato:hover{border-color:var(--linea); background:var(--panel2)}
.persona .dato:focus{border-color:var(--acento); background:var(--panel2); color:var(--tinta)}
.persona .dato::placeholder{color:var(--tenue)}
.icono.wa{color:var(--ok); font-size:19px}
.icono.wa:hover{color:var(--ok); border-color:var(--ok);
  background:color-mix(in srgb, var(--ok) 12%, transparent)}
.persona.baja{opacity:.5}
.persona input.nombre{
  background:transparent; border:1px solid transparent; border-radius:7px;
  padding:6px 8px; font-weight:500; width:100%; min-width:0;
}
.persona input.nombre:hover{border-color:var(--linea); background:var(--panel2)}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{
  border:1px solid var(--linea); background:var(--panel2); color:var(--tenue);
  border-radius:20px; padding:4px 11px; cursor:pointer;
  font:500 11px/1.35 "IBM Plex Mono",monospace; letter-spacing:.05em;
  text-transform:uppercase; transition:all .12s; white-space:nowrap;
}
.chip[aria-pressed="true"]{
  color:var(--papel); border-color:transparent; background:var(--c,var(--acento));
}
.persona-acc{display:flex; gap:4px}
.icono{
  background:none; border:1px solid transparent; border-radius:7px; cursor:pointer;
  padding:6px 9px; color:var(--tenue); font-size:13px; line-height:1;
}
.icono:hover{background:var(--panel2); border-color:var(--linea); color:var(--tinta)}
.icono:disabled{opacity:.35; cursor:not-allowed}
.icono:disabled:hover{background:none; border-color:transparent; color:var(--tenue)}

/* Los tres de la cabecera: dibujados, no caracteres tipográficos. */
.icono.trazo{padding:6px; color:var(--suave); display:flex; align-items:center}
.icono.trazo svg{display:block; width:21px; height:21px}
.acciones .icono.trazo + .btn{margin-left:6px}
.icono.peligro:hover{color:var(--peligro); border-color:var(--peligro)}
.icono.confirmando, .btn.confirmando{
  color:#fff; background:var(--peligro); border-color:var(--peligro);
  font:600 11px/1 "IBM Plex Mono",monospace; letter-spacing:.04em;
}
.btn.confirmando{font-size:13px; padding:8px 14px}
.icono.confirmando:hover, .btn.confirmando:hover{color:#fff; filter:brightness(1.1)}

/* ── Mensajes ─────────────────────────────────────────── */
.selector-msj{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.selector-msj button{
  background:var(--panel); border:1px solid var(--linea); color:var(--suave);
  padding:8px 15px; border-radius:20px; cursor:pointer; font-size:13.5px; font-weight:500;
}
.selector-msj button:not([aria-selected="true"]) { opacity:.9 }
.selector-paleta{display:inline-flex; gap:2px; background:var(--panel2);
  border:1px solid var(--linea); border-radius:20px; padding:3px}
.selector-paleta button{
  background:none; border:0; cursor:pointer; color:var(--suave);
  padding:5px 13px; border-radius:20px; font-size:13px; font-weight:500;
}
.selector-paleta button[aria-selected="true"]{background:var(--acento); color:var(--acento-tinta)}
.selector-msj button[aria-selected="true"]{
  background:var(--acento-suave); border-color:var(--acento); color:var(--acento);
}
textarea.msj{
  width:100%; min-height:340px; background:var(--panel);
  border:1px solid var(--linea); border-radius:var(--r); padding:18px 20px;
  font:400 14px/1.65 "IBM Plex Mono",monospace; resize:vertical;
  box-shadow:var(--sombra);
}

/* ── Planilla del mes ─────────────────────────────────── */
.planilla-marco{overflow-x:auto; border:1px solid var(--linea); border-radius:var(--r)}
table.planilla{border-collapse:collapse; width:100%; min-width:660px; font-size:14px}
table.planilla th, table.planilla td{
  border-right:1px solid var(--linea); border-bottom:1px solid var(--linea);
  padding:11px 14px; text-align:center;
}
table.planilla th:last-child, table.planilla td:last-child{border-right:0}
table.planilla tbody tr:last-child th, table.planilla tbody tr:last-child td{border-bottom:0}
table.planilla thead th{
  background:var(--acento); color:var(--acento-tinta); font-family:Archivo;
  font-weight:600; font-size:12px; letter-spacing:.07em; text-transform:uppercase;
  white-space:nowrap; border-right-color:rgba(255,255,255,.22); border-bottom:0;
}
table.planilla thead th .punto{display:inline-block; margin-right:7px; vertical-align:middle;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
table.planilla th.esquina{background:var(--acento); text-align:left; text-transform:capitalize;
  font-size:13px; letter-spacing:.02em}
table.planilla th.fila-fecha{
  background:var(--panel2); text-align:left; white-space:nowrap; font-family:Archivo;
  font-weight:600; font-size:14px;
}
table.planilla tbody tr:nth-child(even) td{background:var(--panel2)}
table.planilla td.hueco{color:var(--tenue)}

/* ── Ajustes ──────────────────────────────────────────── */
.puestos-cfg{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto auto auto;
  align-items:center; column-gap:0;
}
/* El aire entre columnas va por dentro de cada celda, para que la línea
   de abajo sea una sola y no una hilera de trocitos. */
.puestos-cfg > * { padding-left:7px; padding-right:7px }
.puestos-cfg > .puesto-cfg > * { padding-left:7px; padding-right:7px }
.puestos-cfg .cab{
  font:500 10px/1 "IBM Plex Mono",monospace; letter-spacing:.08em;
  text-transform:uppercase; color:var(--tenue); padding-bottom:10px;
  white-space:nowrap;
}
/* Una línea que cruza la fila entera: apoyarla en el borde de cada celda la
   dejaba partida, y el selector de color ni siquiera la dibujaba. */
.puestos-cfg .linea{grid-column:1/-1; height:1px; background:var(--linea); padding:0}
.puestos-cfg > .puesto-cfg:last-child > .linea{background:transparent}
.puestos-cfg .cab.centro{text-align:center}
.puestos-cfg .cab .ayuda{
  background:none; border:1px solid var(--linea); color:var(--tenue);
  border-radius:50%; cursor:pointer; width:15px; height:15px; padding:0;
  margin-left:5px; font:600 10px/1 "IBM Plex Mono",monospace; vertical-align:middle;
}
.puestos-cfg .cab .ayuda:hover{color:var(--acento); border-color:var(--acento)}
.explica{
  margin-top:15px; padding:13px 16px; background:var(--acento-suave);
  border-radius:var(--r); color:var(--tinta); font-size:13.5px; line-height:1.6;
  max-width:70ch; border-left:3px solid var(--acento);
}
.puesto-cfg{display:contents}
.puestos-cfg > .puesto-cfg > *{padding-top:11px; padding-bottom:11px}
/* La línea es una celda más: hay que sacarle el relleno que llevan las otras,
   o se convierte en una barra de 23px de alto. */
.puestos-cfg > .linea, .puestos-cfg > .puesto-cfg > .linea{
  padding:0; margin:0; height:1px; min-height:1px; align-self:stretch;
}
.puesto-cfg .tinte{
  width:26px; height:26px; border:1px solid var(--linea);
  border-radius:7px; background:none; cursor:pointer; box-sizing:border-box;
}
/* El selector de color es un input: el relleno de columna va como margen. */
.puestos-cfg > .puesto-cfg > .tinte{padding:0; margin:11px 7px}
.puesto-cfg .rotulo{
  min-width:0; width:100%; background:transparent; border:1px solid var(--linea);
  border-radius:7px; padding:7px 10px; font-weight:500; font-size:14.5px;
}
.puesto-cfg .rotulo:hover{border-color:var(--linea); background:var(--panel2)}
.puesto-cfg .turno{display:flex; justify-content:center}
.puesto-cfg .turno input{accent-color:var(--acento); cursor:pointer; width:17px; height:17px}
.puesto-cfg .cupo{display:flex; justify-content:center}
.puesto-cfg .cupo input{
  width:56px; background:var(--panel2); border:1px solid var(--linea);
  border-radius:7px; padding:6px 7px; text-align:center; font-size:14px;
}
@media (max-width:640px){

<script id="app">

];

const NARANJA = "#FDA72C";
const LOGO_D = "m 128.7,161.7 c -11.5,-1.9 -17.7,3.5 -19.6,8.6 -0.2,0.5 -0.7,0.4 -0.7,0 v -1.6 c 0,-5.7 5.1,-10.9 11.1,-17 l 10,-10 26.6,4.6 c 0,0 7.6,7.6 14.1,14.1 12.5,-14.8 20.1,-34 20.1,-54.9 0,-46.9 -38,-84.9 -84.9,-84.9 -46.9,0 -84.9,38 -84.9,84.9 0,20.9 7.6,40.1 20.1,54.9 6.5,-6.5 14.1,-14.1 14.1,-14.1 l 30.2,-5.2 c 14,-2.4 17.5,0.7 17.5,5.4 0,0.2 -0.2,0.4 -0.4,0.4 h -8.5 c -0.2,0 -0.2,0.2 -0.2,0.4 v 5.2 c 0,0.2 -0.2,0.2 0,0.2 h 8.7 c 0.2,0 0.4,0.2 0.4,0.4 0,0 0,16.9 0,17.3 0,0.4 -0.5,0.5 -0.7,0.1 -1.9,-5.1 -8.1,-10.5 -19.6,-8.6 0,0 -19.9,3.4 -34.7,6 15.2,14.1 35.5,22.8 57.9,22.8 22.4,0 42.7,-8.6 57.9,-22.8 -14.6,-2.8 -34.5,-6.2 -34.5,-6.2 z m -19.5,0.2 c -0.1,0.5 -0.7,0.5 -0.7,0 V 153 c 0,-0.2 0.1,-0.4 0.3,-0.4 h 4.4 c -1.9,2.7 -3.2,5.3 -4,9.3 z m 31.5,-55.5 c 2.1,6.9 0.7,17.4 -9.2,27.4 l -12,11.8 c -0.3,0.3 -0.7,0.8 -1,0.8 h -8.2 c 2,-3 5.4,-6.8 9.2,-10.6 l 8.3,-8.3 C 138.3,117 140,112 140,106.2 c 0.1,-0.4 0.6,-0.4 0.7,0.2 z m -16.3,-6.5 c 6.8,-6.8 8.5,-14.7 3,-19.4 -0.5,-0.4 -0.2,-0.9 0.4,-0.6 6.8,3.1 12.1,14.3 0.5,25.9 l -8.8,8.8 c -6,6 -8.8,8.8 -10.3,16.1 -0.1,0.5 -0.7,0.5 -0.7,0 v -8.9 c 0,-5.7 5,-10.9 11.1,-17 z m -54.1,8 C 68.2,101 69.6,90.5 79.5,80.5 l 26.4,-26.4 c 6,-6 9.1,-8.9 10.6,-16.1 0.1,-0.5 1,-0.5 1,0 v 8.9 c 0,5.7 -5.3,10.9 -11.4,17 L 83.3,86.6 C 72.7,97.2 71,102.1 71,107.9 c 0,0.6 -0.5,0.6 -0.7,0 z m 4,15.7 c -5.9,-7.2 -3.9,-18.4 7.7,-30 l 23.9,-23.9 c 6,-6 9.1,-8.9 10.6,-16.2 0.1,-0.5 1,-0.5 1,0 v 9 c 0,5.7 -5.3,10.9 -11.4,17 l -21.2,21.1 c -4.4,4.4 -13.9,13.8 -10,22.6 0.3,0.6 -0.2,0.9 -0.6,0.4 z m 12.3,-9.2 c -6.8,6.8 -8.5,14.7 -3,19.4 0.5,0.4 0.2,0.9 -0.4,0.6 -6.8,-3.1 -12.1,-14.3 -0.5,-25.9 l 23.2,-23.2 c 6,-6 9.1,-8.8 10.6,-16.1 0.1,-0.5 1,-0.5 1,0 v 8.9 c 0,5.7 -5.3,10.9 -11.4,17 z m 21.9,23 c 0,-5.7 5,-10.9 11.1,-17 l 6.7,-6.7 c 4.4,-4.4 13.8,-13.8 9.9,-22.6 -0.3,-0.6 0.2,-0.9 0.6,-0.4 5.9,7.2 3.9,18.4 -7.7,30 l -9.5,9.5 c -6,6 -8.8,8.9 -10.3,16.2 -0.1,0.5 -0.7,0.5 -0.7,0 v -9 z";

  recargar: "M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 " +
            "4.22 1.78L13 11h7V4l-2.35 2.35z",

  rehacer:  "M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 " +
            "4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"
};
const trazo = nombre =>
  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<path d="' + TRAZOS[nombre] + '"/></svg>';

const logoSVG = color =>
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 169.8 170.1" role="img" ' +
  'aria-label="Iglesia Adventista del Séptimo Día">' +
  '<path fill="' + color + '" transform="translate(-20.5,-20.6)" d="' + LOGO_D + '"/></svg>';

// Los iconos de la pantalla de inicio: se leen del head para reponerlos tal
// cual cuando la página se vuelve a publicar a sí misma.
// Al publicar desde fuera, el visor envuelve la página y estas etiquetas
// quedan en el cuerpo, donde iOS no las mira: al agregar a la pantalla de
// inicio usaba el favicon genérico. Se mudan a la cabecera apenas carga, que
// es el DOM que Safari lee en ese momento.

let E = {equipos:[], equipoActual:null, mesActual:null};   // lo llena la base al arrancar

// Varios equipos en la misma app: cada uno con su gente, sus puestos y sus
// plannings. AC es el que se está viendo; todo el resto del código trabaja
// contra él y no necesita saber que hay otros.
let AC = null;
function fijarActivo(){
  if(!Array.isArray(E.equipos) || !E.equipos.length){
    // Estado de cuando había un solo equipo: se envuelve sin perder nada.
    E.equipos = [{
      id: "equipo-1", nombre: "Megafonía",
      puestos: E.puestos || [], gente: E.equipo || [],
      config: E.config || {dias:[6], tardeExclusiva:true},
      plannings: E.plannings || {}, notas: E.notas || {},
      restricciones: E.restricciones || {}, enviados: E.enviados || {}
    }];
    ["puestos","equipo","config","plannings","notas","restricciones","enviados"]
      .forEach(k => { delete E[k]; });
  }
  let elegido = E.equipoActual;
  try{
    const suyo = localStorage.getItem("megafonia:equipo");
    if(suyo && E.equipos.some(t => t.id === suyo)) elegido = suyo;
  }catch(e){}
  AC = E.equipos.find(t => t.id === elegido) || E.equipos[0];
  E.equipoActual = AC.id;
  if(!Array.isArray(AC.gente)) AC.gente = [];
  if(!AC.config) AC.config = {dias:[6], tardeExclusiva:false};
  if(!AC.plannings) AC.plannings = {};
  if(!AC.notas) AC.notas = {};
  if(!AC.restricciones) AC.restricciones = {};
  if(!AC.enviados) AC.enviados = {};
  fijarPuestos();
}
function fijarPuestos(){
  if(!Array.isArray(AC.puestos) || !AC.puestos.length)
    AC.puestos = JSON.parse(JSON.stringify(PUESTOS_INICIALES));
  AC.puestos.forEach((p, i) => {         // completa lo que falte, sin pisar lo elegido
    if(!p.color) p.color = PALETA_PUESTOS[i % PALETA_PUESTOS.length];
    if(!p.emoji) p.emoji = "•";
    if(!(p.cupo >= 1)) p.cupo = 1;
  });
  PUESTOS = AC.puestos;
}
fijarActivo();
// El CSS y este mismo script son el molde con el que la página se reconstruye al guardar.
// Hay que leerlos ahora: el primer render los saca de vista.
const FUENTE_CSS = document.getElementById("css").textContent;
const FUENTE_JS  = document.getElementById("app").textContent;
const RAIZ = document.createElement("div");
// Abierto como archivo suelto, este script corre con el parser todavía en <head>
// y document.body no existe: se monta en cuanto el documento termine de cargar.
function montarRaiz(){
  if(RAIZ.isConnected) return;
  if(document.body) document.body.appendChild(RAIZ);
  else document.addEventListener("DOMContentLoaded", montarRaiz, {once:true});
}
montarRaiz();
let avisosAbiertos = false, ayudaTurno = false;
try{ avisosAbiertos = localStorage.getItem("megafonia:avisos") === "1"; }catch(e){}
let sucio = false, vista = "planning", tipoMsj = "planning", soloLectura = false;
const LLAVE_LOCAL = "megafonia:estado";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const claveMes = (a,m) => a + "-" + String(m+1).padStart(2,"0");
const persona  = id => AC.gente.find(p => p.id === id) || null;
const nombreDe = id => (persona(id) || {}).nombre || "";

function mesVigente(){
  const h = new Date(), hoy = claveMes(h.getFullYear(), h.getMonth());
  if(!E.mesActual || E.mesActual < hoy) E.mesActual = hoy;
  const [a,m] = E.mesActual.split("-").map(Number);
  return {anio:a, mes:m-1};
}
function fechasDelMes(anio, mes){
  const total = new Date(Date.UTC(anio, mes+1, 0)).getUTCDate(), out = [];
  for(let d=1; d<=total; d++){
    const dow = new Date(Date.UTC(anio, mes, d)).getUTCDay();
    if(AC.config.dias.includes(dow)) out.push({dia:d, dow:dow});
  }
  return out;
}
/* ═══ Disponibilidad del mes ═══════════════════════════════════════
   Una restricción dice cuándo puede una persona en UN mes concreto:
     {id, tipo:"solo"|"no", dias:[5,12], texto:"la frase que la originó"}
   "solo" = únicamente esas fechas. "no" = esas fechas no.
   Son del mes, no del equipo: en octubre se arranca de cero.        */

function restriccionesDe(clave){
  if(!AC.restricciones) AC.restricciones = {};
  if(!AC.restricciones[clave]) AC.restricciones[clave] = [];
  return AC.restricciones[clave];
}
function notaDe(clave){
  if(!AC.notas) AC.notas = {};
  return AC.notas[clave] || "";
}
function puedeEse(idPersona, dia, restricciones){
  for(const r of restricciones){
    if(r.id !== idPersona) continue;
    if(r.tipo === "solo" && !r.dias.includes(dia)) return false;
    if(r.tipo === "no"   &&  r.dias.includes(dia)) return false;
  }
  return true;
}
function resumenRestriccion(r){
  const dias = r.dias.slice().sort((a,b) => a-b).join(", ");
  return (nombreDe(r.id) || "?") + (r.tipo === "solo"
    ? (r.dias.length ? " · solo el " + dias : " · no puede ningún día")
    : " · no puede el " + dias);
}

function planningDe(anio, mes){
  const clave = claveMes(anio, mes);
  const fechas = fechasDelMes(anio, mes);
  let plan = AC.plannings[clave];
  if(!plan) plan = AC.plannings[clave] = {fechas:[]};
  // Sincroniza con el calendario: conserva lo asignado, suma o quita fechas.
  const previas = new Map(plan.fechas.map(f => [f.dia, f]));
  plan.fechas = fechas.map(f => {
    const vieja = previas.get(f.dia) || {dia:f.dia, puestos:{}};
    PUESTOS.forEach(p => {
      const actual = vieja.puestos[p.id] || [];
      vieja.puestos[p.id] = Array.from({length:p.cupo}, (_,i) => actual[i] || null);
    });
    vieja.dow = f.dow;
    return vieja;
  });
  return plan;
}

/* ═══ Generador ════════════════════════════════════════════════════ */

function rng(semilla){
  let a = semilla + 0x6D2B79F5;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function historialPrevio(claveActual){
  const conteo = {};
  Object.keys(AC.plannings).forEach(clave => {
    if(clave === claveActual) return;
    AC.plannings[clave].fechas.forEach(f =>
      Object.values(f.puestos).forEach(slots =>
        slots.forEach(id => { if(id) conteo[id] = (conteo[id]||0) + 1; })));
  });
  return conteo;
}
function intento(fechas, gente, historial, azar, restricciones){
  const vecesMes = {}, vecesPuesto = {}, ultima = {};
  gente.forEach(p => { vecesMes[p.id] = 0; vecesPuesto[p.id] = {}; });
  let huecos = 0;
  const plan = fechas.map((f, idx) => {
    const enManana = new Set(), enTarde = new Set(), puestos = {};
    PUESTOS.forEach(pu => {
      puestos[pu.id] = Array.from({length:pu.cupo}, () => {
        const esTarde = pu.otroTurno === true;
        const vetados = (esTarde && !AC.config.tardeExclusiva)
          ? enTarde : new Set([...enManana, ...enTarde]);
        const candidatos = gente.filter(p => p.puestos.includes(pu.id) && !vetados.has(p.id)
                                          && puedeEse(p.id, f.dia, restricciones));
        if(!candidatos.length){ huecos++; return null; }
        let mejor = null, mejorCosto = Infinity;
        for(const p of candidatos){
          // Repetir el mismo puesto pesa más que servir una vez más: si no,
          // quien solo hace un puesto se lo queda todo el mes y nadie más rota.
          let c = (vecesPuesto[p.id][pu.id]||0) * 40;
          c += vecesMes[p.id] * 25;                        // reparte dentro del mes
          c += (historial[p.id]||0) * 8;                   // y a lo largo del año
          if(ultima[p.id] === idx-1) c += 30;              // evita fechas seguidas
          c += azar();
          if(c < mejorCosto){ mejorCosto = c; mejor = p; }
        }
        vecesMes[mejor.id]++;
        vecesPuesto[mejor.id][pu.id] = (vecesPuesto[mejor.id][pu.id]||0) + 1;
        ultima[mejor.id] = idx;
        (esTarde ? enTarde : enManana).add(mejor.id);
        return mejor.id;
      });
    });
    return {dia:f.dia, dow:f.dow, puestos:puestos};
  });
  const cargas = Object.values(vecesMes);
  const desbalance = cargas.length ? Math.max(...cargas) - Math.min(...cargas) : 0;
  // Cada vez que alguien repite un puesto ya hecho este mes cuenta como monotonía.
  let repeticiones = 0;
  Object.values(vecesPuesto).forEach(porPuesto =>
    Object.values(porPuesto).forEach(v => { if(v > 1) repeticiones += v - 1; }));
  const costo = huecos*1000 + repeticiones*30 + desbalance*10
              + cargas.reduce((s,v) => s + v*v, 0);
  return {plan:plan, huecos:huecos, costo:costo};
}
function generar(){
  const {anio, mes} = mesVigente();
  const fechas = fechasDelMes(anio, mes);
  const gente = AC.gente.filter(p => p.activo && p.puestos.length);
  if(!fechas.length) return brindis("No hay fechas de servicio este mes. Revisá los días en Equipo.");
  if(!gente.length)  return brindis("No hay nadie activo en el equipo.");
  const historial = historialPrevio(claveMes(anio, mes));
  const restricciones = restriccionesDe(claveMes(anio, mes));
  let mejor = null;
  for(let s=0; s<3000; s++){
    const r = intento(fechas, gente, historial, rng(s), restricciones);
    if(!mejor || r.costo < mejor.costo) mejor = r;
  }
  AC.plannings[claveMes(anio, mes)] = {fechas:mejor.plan};
  marcarSucio(); render();
  brindis(mejor.huecos ? mejor.huecos + " puesto(s) sin cubrir: falta gente habilitada"
                       : "Planning generado");
}

function textoPlanning(){
  const {anio, mes} = mesVigente();
  const plan = planningDe(anio, mes);
  const out = ["📢 *" + AC.nombre.toUpperCase() + " — " + MESES[mes].toUpperCase() + " " + anio + "*", ""];
  plan.fechas.forEach(f => {
    out.push("*" + DIAS_SEM[f.dow] + " " + f.dia + "*");
    PUESTOS.forEach(p => {
      const quienes = f.puestos[p.id].filter(Boolean).map(nombreDe);
      out.push(p.emoji + " " + p.label + ": " + (quienes.length ? quienes.join(" – ") : "_a cubrir_"));
    });
    out.push("");
  });
  out.push("Cualquier cambio, avisen con tiempo 🙏");
  return out.join("\n");
}
function proximaFecha(){
  const hoy = new Date();
  const corte = Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const claves = Object.keys(AC.plannings).sort();
  for(const clave of claves){
    const [a,m] = clave.split("-").map(Number);
    for(const f of AC.plannings[clave].fechas){
      if(Date.UTC(a, m-1, f.dia) >= corte) return {f:f, anio:a, mes:m-1};
    }
  }
  return null;
}
function textoRecordatorio(){
  const prox = proximaFecha();
  if(!prox) return "No hay ningún servicio próximo cargado.\n\nGenerá el planning del mes y volvé acá.";
  const {f, mes} = prox;
  const out = ["🔔 *Recordatorio — " + DIAS_SEM[f.dow].toLowerCase() + " " + f.dia + " de " + MESES[mes] + "*", ""];
  PUESTOS.forEach(p => {
    const quienes = f.puestos[p.id].filter(Boolean).map(nombreDe);
    out.push(p.emoji + " " + p.label + ": " + (quienes.length ? quienes.join(" – ") : "_a cubrir_"));
  });
  out.push("", "Si alguien no puede, avisá cuanto antes así reacomodamos 🙌");
  return out.join("\n");
}

// Foto del mes tal como se mandó al grupo la última vez. Contra esto se
// comparan los cambios, para avisar solo lo que se movió.
function fotoDelMes(plan){
  const out = {};
  plan.fechas.forEach(f => {
    out[f.dia] = {};
    PUESTOS.forEach(p => { out[f.dia][p.id] = f.puestos[p.id].slice(); });
  });
  return out;
}
function marcarComoEnviado(){
  const {anio, mes} = mesVigente();
  AC.enviados = AC.enviados || {};
  AC.enviados[claveMes(anio, mes)] = fotoDelMes(planningDe(anio, mes));
}
function hayReferencia(){
  const {anio, mes} = mesVigente();
  return !!(AC.enviados && AC.enviados[claveMes(anio, mes)]);
}

function textoCambios(){
  const {anio, mes} = mesVigente();
  const clave = claveMes(anio, mes);
  const antes = AC.enviados && AC.enviados[clave];
  if(!antes)
    return "Todavía no marcaste el planning de este mes como mandado.\n\n" +
           "Se marca solo cuando copiás la imagen o el texto desde acá. Si ya lo mandaste " +
           "por afuera, andá a «Planning del mes» y copiá la imagen: eso queda como punto " +
           "de partida, y de ahí en más vas a ver solo lo que cambie.";

  const plan = planningDe(anio, mes);
  const lineas = [];
  plan.fechas.forEach(f => {
    const viejo = antes[f.dia];
    const cambios = [];
    PUESTOS.forEach(p => {
      const ahora = f.puestos[p.id];
      const era = (viejo && viejo[p.id]) || [];
      ahora.forEach((id, i) => {
        if(id === (era[i] || null)) return;
        const quien = id ? nombreDe(id) : "_a cubrir_";
        const cual  = era[i] ? nombreDe(era[i]) : "nadie";
        cambios.push(p.emoji + " " + p.label + ": *" + quien + "* (antes " + cual + ")");
      });
    });
    if(cambios.length){
      lineas.push("*" + DIAS_SEM[f.dow] + " " + f.dia + "*");
      lineas.push.apply(lineas, cambios);
      lineas.push("");
    }
  });

  if(!lineas.length)
    return "No hubo ningún cambio desde lo último que mandaste.\n\n" +
           "Si moviste algo y no aparece acá, fijate que sea de este mes.";

  return ["🔄 *" + AC.nombre.toUpperCase() + " · CAMBIOS — " + MESES[mes].toUpperCase() + " " + anio + "*", ""]
    .concat(lineas)
    .concat(["El resto queda igual que lo que mandé antes 🙏"]).join("\n");
}

// Devuelve, por fecha, quién quedó puesto dos veces. Los desplegables filtran por
// puesto habilitado pero no por esto, así que a mano se puede armar sin querer.
function choques(plan){
  const salida = [];
  const {anio, mes} = mesVigente();
  const restricciones = restriccionesDe(claveMes(anio, mes));
  plan.fechas.forEach(f => {
    // Alguien asignado a un día que sus notas de disponibilidad excluyen.
    PUESTOS.forEach(pu => (f.puestos[pu.id] || []).forEach(id => {
      if(id && !puedeEse(id, f.dia, restricciones))
        salida.push({dia:f.dia, dow:f.dow, id:id, disponibilidad:true,
                     motivo:"no puede este d\u00eda y est\u00e1 en " + pu.label.toLowerCase()});
    }));
    const manana = new Map();          // id -> puestos de la mañana que ocupa
    PUESTOS.forEach(pu => {
      if(pu.otroTurno) return;
      (f.puestos[pu.id] || []).forEach(id => {
        if(!id) return;
        manana.set(id, (manana.get(id) || []).concat(pu.label));
      });
    });
    manana.forEach((puestos, id) => {
      if(puestos.length > 1)
        salida.push({dia:f.dia, dow:f.dow, id:id, motivo:puestos.join(" y ") + " a la vez"});
    });

    const otros = PUESTOS.filter(pu => pu.otroTurno);
    otros.forEach(pu => {
      const enTurno = (f.puestos[pu.id] || []).filter(Boolean);
      enTurno.forEach((id, i) => {
        if(enTurno.indexOf(id) !== i)
          salida.push({dia:f.dia, dow:f.dow, id:id,
                       motivo:"dos veces en " + pu.label.toLowerCase()});
        else if(AC.config.tardeExclusiva && manana.has(id))
          salida.push({dia:f.dia, dow:f.dow, id:id, tarde:true,
                       motivo:manana.get(id)[0] + " y además " + pu.label.toLowerCase()});
      });
    });
  });
  return salida;
}

function vistaPlanning(plan, activos){
  if(!plan.fechas.length) return '<div class="vacio">Este mes no tiene fechas de servicio.<br>' +
    'Elegí qué días sirven en la pestaña <b>Equipo</b>.</div>';

  const sinCubrir = plan.fechas.reduce((n,f) =>
    n + PUESTOS.reduce((k,p) => k + f.puestos[p.id].filter(x => !x).length, 0), 0);
  const dobles = choques(plan);

  // Rojo: está en dos puestos a la vez. Ámbar: anotaste que ese día no puede.
  const rojos = new Set(dobles.filter(d => !d.disponibilidad).map(d => d.dia + "|" + d.id));
  const ambar = new Map(dobles.filter(d => d.disponibilidad)
    .map(d => [d.dia + "|" + d.id, (nombreDe(d.id) || "") + " " + d.motivo]));
  const tarjetas = plan.fechas.map(f =>
    '<article class="fecha">' +
      '<div class="fecha-tope"><span class="dia">' + DIAS_SEM[f.dow] + '</span>' +
        '<span class="num">' + f.dia + '</span></div>' +
      PUESTOS.map(p =>
        '<div class="puesto">' +
          '<span class="puesto-nom"><span class="punto" style="background:' + esc(p.color) + '"></span>' +
            '<span class="texto">' + esc(p.label) + '</span></span>' +
          '<div class="slots">' +
            f.puestos[p.id].map((asignado, i) =>
              selectorAsig(f.dia, p, i, asignado, activos,
                           asignado && rojos.has(f.dia + "|" + asignado),
                           asignado && ambar.get(f.dia + "|" + asignado))).join("") +
          '</div>' +
        '</div>').join("") +
    '</article>').join("");

  const abierto = avisosAbiertos ? " open" : "";
  const plegable = (clase, emoji, titulo, cuerpo) =>
    '<details class="avisos ' + clase + '"' + abierto + '><summary>' +
      '<span class="emo">' + emoji + '</span>' + titulo +
    '</summary><div class="detalle">' + cuerpo + '</div></details>';

  const avisoHuecos = sinCubrir ? plegable("huecos", "⚠️",
      '<b>' + sinCubrir + (sinCubrir === 1 ? ' puesto sin cubrir' : ' puestos sin cubrir') + '</b>',
      'Los desplegables vacíos dicen «a cubrir». Asignalos a mano, o habilitá a más gente ' +
      'para esos puestos en <b>Equipo</b>.') : "";

  const avisoDobles = dobles.length ? plegable("doble", "👥",
      '<b>' + (dobles.length === 1 ? "Una persona repetida" : dobles.length + " personas repetidas") +
      '</b> el mismo día',
      '<ul class="choques">' +
      dobles.map(d => '<li><b>' + esc(nombreDe(d.id) || "?") + '</b> — ' +
        DIAS_SEM[d.dow].toLowerCase() + " " + d.dia + ": " + esc(d.motivo) + '</li>').join("") +
      '</ul>' + (dobles.some(d => d.tarde)
        ? 'Tenés activada <b>la regla de tarde exclusiva</b>. Si en tu iglesia es normal que ' +
          'quien sirve a la mañana se quede a la tarde, apagala en <b>Equipo</b>.'
        : 'Nadie puede estar en dos puestos a la vez: cambiá uno de los dos.')) : "";

  const tira = (avisoHuecos || avisoDobles)
    ? '<div class="tira-avisos">' + avisoHuecos + avisoDobles + '</div>' : "";

  // El planning primero: es lo que se viene a mirar. Debajo, lo que se consulta
  // de vez en cuando — la disponibilidad, los avisos y el reparto.
  return '<div class="rejilla">' + tarjetas + '</div>' +
    panelDisponibilidad() + tira + panelReparto(plan);
}

function selectorAsig(dia, puesto, idx, asignado, activos, chocado, ausente){
  // `chocado`: está en dos puestos a la vez, es un error. `ausente`: anotaste
  // que ese día no puede, hay que reemplazarlo. Se ven distinto a propósito.
  const candidatos = activos.filter(p => p.puestos.includes(puesto.id));
  const opciones = ['<option value=""' + (asignado ? "" : " selected") + '>— a cubrir —</option>']
    .concat(candidatos.map(p =>
      '<option value="' + p.id + '"' + (p.id === asignado ? " selected" : "") + '>' + esc(p.nombre) + '</option>'));
  // Alguien asignado que después quedó de baja o perdió el puesto: se muestra igual, no se pierde.
  if(asignado && !candidatos.some(p => p.id === asignado))
    opciones.push('<option value="' + asignado + '" selected>' + esc(nombreDe(asignado) || "?") + ' (fuera)</option>');

  // Una sola marca por celda. Si además no puede, gana el ámbar: al
  // reemplazarlo se resuelve también el doble puesto.
  return '<select class="asig' + (asignado ? "" : " vacio") +
    (ausente ? " ausente" : chocado ? " chocado" : "") +
    '" data-dia="' + dia + '" data-puesto="' + puesto.id + '" data-idx="' + idx + '"' +
    (ausente ? ' title="' + esc(ausente) + '"' : "") +
    (soloLectura ? " disabled" : "") + '>' + opciones.join("") + '</select>';
}

function panelReparto(plan){
  const conteo = {};
  AC.gente.filter(p => p.activo).forEach(p => conteo[p.id] = 0);
  plan.fechas.forEach(f => Object.values(f.puestos).forEach(slots =>
    slots.forEach(id => { if(id) conteo[id] = (conteo[id]||0) + 1; })));
  const filas = Object.keys(conteo)
    .sort((a,b) => conteo[b] - conteo[a] || nombreDe(a).localeCompare(nombreDe(b)))
    .map(id => '<div class="reparto-fila"><span class="quien">' + esc(nombreDe(id) || "?") + '</span>' +
      '<span class="barra">' + "<i></i>".repeat(conteo[id]) + '<b>' + conteo[id] + '</b></span></div>').join("");
  return '<section class="tarjeta"><h2>Reparto del mes</h2><div class="reparto">' +
    (filas || '<span class="quien">Todavía no hay nadie asignado.</span>') + '</div></section>';
}

function tablaHTML(){
  // Una tabla por mes, para que lo que ves en pantalla sea lo mismo que se copia.
  return mesesDeLaPlanilla().map(m => {
    const plan = planningDe(m.anio, m.mes);
    if(!plan.fechas.length) return "";
    const cabecera = '<tr><th class="esquina">' + esc(rotuloMes(m)) + '</th>' +
      PUESTOS.map(p => '<th><span class="punto" style="background:' + esc(p.color) + '"></span>' +
        p.label + '</th>').join("") + '</tr>';
    const cuerpo = plan.fechas.map(f =>
      '<tr><th class="fila-fecha">' + DIAS_SEM[f.dow] + " " + f.dia + '</th>' +
      PUESTOS.map(p => {
        const q = f.puestos[p.id].filter(Boolean).map(nombreDe);
        return '<td' + (q.length ? "" : ' class="hueco"') + '>' +
          (q.length ? esc(q.join(" – ")) : "—") + '</td>';
      }).join("") + '</tr>').join("");
    return '<div class="planilla-marco"><table class="planilla"><thead>' + cabecera +
      '</thead><tbody>' + cuerpo + '</tbody></table></div>';
  }).join("");
}

/* ═══ Imagen de la planilla ═════════════════════════════════════════ */

const IMG = {ancho:1580, filaAlto:78, cabeceraAlto:84, titulo:96, margen:34,
             colFecha:250, logo:46, radio:16, aire:24};

// Dos versiones de la misma planilla. La oscura es la que se ve en pantalla;
// la clara imprime mejor y pesa menos en un chat con fondo blanco.
const PALETAS = {
  clara: {tinta:"#16222D", suave:"#5D7383", papel:"#FFFFFF", cebra:"#F3F7F9",
          linea:"#DCE5EB", acento:"#0B6E8A", sobreAcento:"#FFFFFF"},
  oscura:{tinta:"#E7EFF4", suave:"#93A9B7", papel:"#16222D", cebra:"#1D2B36",
          linea:"#2B3D4A", acento:"#4CB7D4", sobreAcento:"#0A1F28"}
};
let paletaImagen = "oscura";
try{ paletaImagen = localStorage.getItem("megafonia:paleta") || "oscura"; }catch(e){}

// Cuántos meses entran en la misma planilla. Escuela Sabática arma el trimestre
// completo y hay que mandarlo en una sola foto, no en tres.
let mesesImagen = 1;
try{
  mesesImagen = Math.min(6, Math.max(1, Number(localStorage.getItem("megafonia:meses")) || 1));
}catch(e){}

// Los meses de la planilla, arrancando por el que estás mirando.
function mesesDeLaPlanilla(){
  const {anio, mes} = mesVigente();
  return Array.from({length:mesesImagen}, (_, i) => {
    const d = new Date(Date.UTC(anio, mes + i, 1));
    return {anio:d.getUTCFullYear(), mes:d.getUTCMonth()};
  });
}
const rotuloMes = m => MESES[m.mes].charAt(0).toUpperCase() + MESES[m.mes].slice(1) +
                       " " + m.anio;

let imgLogo = null;
function cargarLogo(){
  return new Promise(listo => {
    if(imgLogo) return listo(imgLogo);
    const im = new Image();
    im.onload  = () => { imgLogo = im; listo(im); };
    im.onerror = () => listo(null);          // sin logo la planilla sale igual, solo sin símbolo
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(logoSVG(NARANJA));
  });
}

function dibujarPlanilla(){
  const P = PALETAS[paletaImagen] || PALETAS.oscura;
  const anchoCol = (IMG.ancho - IMG.margen*2 - IMG.colFecha) / PUESTOS.length;
  const anchoTabla = IMG.ancho - IMG.margen*2;
  const x0 = IMG.margen;

  // Una tabla por mes, apiladas. Cada una lleva su mes en la esquina, así que
  // el título de arriba se queda con el nombre del equipo y nada más.
  const bloques = mesesDeLaPlanilla().map(m => ({
    rotulo: rotuloMes(m),
    filas:  planningDe(m.anio, m.mes).fechas
  }));
  const altoDe = b => IMG.cabeceraAlto + b.filas.length*IMG.filaAlto;
  // El título ya trae su propio aire arriba: abajo va un solo margen.
  const alto = IMG.titulo + bloques.reduce((t, b) => t + altoDe(b), 0) +
               IMG.aire*(bloques.length - 1) + IMG.margen;

  const cv = document.createElement("canvas");
  const esc2 = 2;
  cv.width = IMG.ancho*esc2; cv.height = alto*esc2;
  const c = cv.getContext("2d");
  c.scale(esc2, esc2);
  const fuente = (peso, px, familia) => peso + " " + px + 'px ' + familia +
    ', "Helvetica Neue", Arial, sans-serif';

  c.fillStyle = P.papel; c.fillRect(0, 0, IMG.ancho, alto);

  // Título, con el símbolo a la izquierda
  let x = IMG.margen;
  if(imgLogo){
    c.drawImage(imgLogo, x, IMG.margen, IMG.logo, IMG.logo);
    x += IMG.logo + 20;
  }
  const baseTitulo = IMG.margen + IMG.logo/2 + 10;
  c.textBaseline = "alphabetic"; c.textAlign = "left";
  c.fillStyle = P.tinta; c.font = fuente(700, 29, "Archivo");
  c.fillText(AC.nombre.toUpperCase(), x, baseTitulo);   // el mes ya va en la esquina

  let y0 = IMG.titulo;
  bloques.forEach((bloque, nb) => {
    const filas = bloque.filas;
    const altoTabla = altoDe(bloque);
    const tope = y0;
    const marco = () => {
      c.beginPath();
      if(c.roundRect) c.roundRect(x0, tope, anchoTabla, altoTabla, IMG.radio);
      else c.rect(x0, tope, anchoTabla, altoTabla);
    };
    c.save(); marco(); c.clip();          // todo lo de adentro respeta las esquinas

    // Cabecera, como la tabla de la pantalla: el mes en la esquina y cada
    // puesto con su punto de color delante.
    c.fillStyle = P.acento;
    c.fillRect(x0, tope, anchoTabla, IMG.cabeceraAlto);
    const medio = tope + IMG.cabeceraAlto/2;

    c.fillStyle = P.sobreAcento; c.textBaseline = "middle"; c.textAlign = "left";
    c.font = fuente(600, 24, "Archivo");
    c.fillText(bloque.rotulo, x0 + 22, medio);

    c.font = fuente(600, 23, "Archivo");
    PUESTOS.forEach((p, i) => {
      const cx = x0 + IMG.colFecha + anchoCol*i + anchoCol/2;
      const etiqueta = p.label.toUpperCase();
      const ancho = c.measureText(etiqueta).width;
      const puntoX = cx - (ancho + 13 + 11)/2;

      c.fillStyle = p.color;                   // el punto del color del puesto
      c.beginPath();
      if(c.roundRect) c.roundRect(puntoX, medio - 5.5, 11, 11, 3);
      else c.rect(puntoX, medio - 5.5, 11, 11);
      c.fill();

      c.fillStyle = P.sobreAcento; c.textAlign = "left";
      c.fillText(etiqueta, puntoX + 11 + 13, medio);
    });

    // Filas
    filas.forEach((f, i) => {
      const y = tope + IMG.cabeceraAlto + i*IMG.filaAlto;
      c.fillStyle = i % 2 ? P.cebra : P.papel;
      c.fillRect(x0, y, anchoTabla, IMG.filaAlto);

      c.textAlign = "left"; c.fillStyle = P.tinta;
      c.font = fuente(600, 24, "Archivo");
      c.fillText(DIAS_SEM[f.dow] + " " + f.dia, x0 + 22, y + IMG.filaAlto/2);

      c.textAlign = "center"; c.font = fuente(400, 24, '"IBM Plex Sans"');
      PUESTOS.forEach((p, j) => {
        const q = f.puestos[p.id].filter(Boolean).map(nombreDe);
        const cx = x0 + IMG.colFecha + anchoCol*j + anchoCol/2;
        c.fillStyle = q.length ? P.tinta : P.suave;
        const txt = q.length ? q.join(" \u00b7 ") : "\u2014";
        if(q.length === 2 && c.measureText(txt).width > anchoCol - 26){
          c.font = fuente(400, 21, '"IBM Plex Sans"');
          c.fillText(q[0], cx, y + IMG.filaAlto/2 - 13);
          c.fillText(q[1], cx, y + IMG.filaAlto/2 + 13);
          c.font = fuente(400, 24, '"IBM Plex Sans"');
        }else{
          let f2 = 24;
          while(f2 > 15 && c.measureText(txt).width > anchoCol - 26){
            f2 -= 1; c.font = fuente(400, f2, '"IBM Plex Sans"');
          }
          c.fillText(txt, cx, y + IMG.filaAlto/2);
          c.font = fuente(400, 24, '"IBM Plex Sans"');
        }
      });
    });

    // Rejilla
    c.strokeStyle = P.linea; c.lineWidth = 1;
    for(let i = 0; i <= filas.length; i++){
      const y = tope + IMG.cabeceraAlto + i*IMG.filaAlto + .5;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + anchoTabla, y); c.stroke();
    }
    for(let j = 0; j <= PUESTOS.length; j++){
      const xr = x0 + IMG.colFecha + anchoCol*j + .5;
      c.beginPath(); c.moveTo(xr, tope); c.lineTo(xr, tope + altoTabla); c.stroke();
    }
    c.restore();                          // fin del recorte redondeado
    marco(); c.stroke();

    y0 += altoTabla + IMG.aire;
  });

  return cv;
}

// "Escuela Sabática" -> "escuela-sabatica", para el nombre del archivo.
function archivoDe(nombre){
  return (nombre || "planning").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "planning";
}

async function imagenDelMes(){
  try{ await document.fonts.ready; }catch(e){}   // sin las fuentes cargadas saldría con la de reserva
  await cargarLogo();
  return new Promise(res => dibujarPlanilla().toBlob(res, "image/png"));
}

async function copiarImagen(){
  const btn = $("#btn-copiar-img");
  const antes = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Preparando…"; }
  const listo = () => { if(btn){ btn.disabled = false; btn.textContent = antes; } };
  try{
    if(!navigator.clipboard || typeof ClipboardItem === "undefined"){
      listo();
      return brindis("Este navegador no deja copiar imágenes. Usá Descargar.");
    }
    // Safari exige la promesa, no el blob ya resuelto: sirve para los dos.
    await navigator.clipboard.write([new ClipboardItem({"image/png": imagenDelMes()})]);
    listo();
    // Mandar la foto es la forma habitual: cuenta igual que copiar el texto.
    if(!soloLectura){ marcarComoEnviado(); marcarSucio(); render(); }
    brindis("Imagen copiada: pegala en el grupo");
  }catch(err){
    listo();
    brindis("No se pudo copiar. Probá con Descargar como imagen.");
  }
}

async function descargarImagen(){
  const btn = $("#btn-imagen");
  if(btn){ btn.disabled = true; btn.textContent = "Preparando…"; }
  const restaurar = () => { if(btn){ btn.disabled = false; btn.textContent = "Descargar como imagen"; } };
  const ms = mesesDeLaPlanilla(), uno = ms[0], otro = ms[ms.length - 1];
  const tramo = ms.length === 1
    ? MESES[uno.mes] + "-" + uno.anio
    : MESES[uno.mes] + "-a-" + MESES[otro.mes] + "-" + otro.anio;
  const nombre = archivoDe(AC.nombre) + "-" + tramo + ".png";
  try{
    bajarArchivo(await imagenDelMes(), nombre);
    restaurar();
    if(!soloLectura){ marcarComoEnviado(); marcarSucio(); render(); }
    brindis("Imagen guardada");
  }catch(err){
    restaurar();
    const code = (err && err.code) || "unavailable";
    if(code === "declined") return;
    if(code === "rate_limited") return brindis("Hay otra descarga esperando respuesta.");
    brindis("No se pudo generar la imagen.");
  }
}

/* ═══ Disponibilidad, a mano ══════════════════════════════════════ */

function agregarRestriccionManual(){
  const {anio, mes} = mesVigente();
  const clave = claveMes(anio, mes);
  const quien = $("#r-quien"), tipo = $("#r-tipo"), dias = $("#r-dias");
  if(!quien || !quien.value) return brindis("Elegí a quién le corresponde.");
  const fechas = fechasDelMes(anio, mes).map(f => f.dia);
  const pedidos = (dias.value.match(/\d+/g) || []).map(Number).filter(d => fechas.includes(d));
  if(tipo.value === "no" && !pedidos.length)
    return brindis("Poné qué días no puede, separados por coma.");
  restriccionesDe(clave).push({id:quien.value, tipo:tipo.value, dias:pedidos, texto:""});
  dias.value = "";
  marcarSucio(); render();
  brindis("Restricción anotada");
}

/* ═══ Deshacer / rehacer ═══════════════════════════════════════════ */

const TOPE_HISTORIAL = 60;
let pilaUndo = [], pilaRedo = [], instantanea = "", ultimoGuardado = "";

// Un mes que solo se hojeó deja un planning vacío, y guardar los descarta:
// si el retrato los contara, "sin guardar" se encendería con solo mirar.
// Tampoco entra qué equipo estás viendo, que no es un cambio del planning.
function conDatos(plannings){
  const out = {};
  Object.keys(plannings || {}).forEach(clave => {
    const pl = plannings[clave];
    if(pl && pl.fechas && pl.fechas.some(f => Object.values(f.puestos).some(sl => sl.some(Boolean))))
      out[clave] = pl;
  });
  return out;
}
const retratoDe = t => JSON.stringify({
  id:t.id, nombre:t.nombre, puestos:t.puestos, gente:t.gente, config:t.config,
  plannings:conDatos(t.plannings), notas:t.notas || {},
  restricciones:t.restricciones || {}, enviados:t.enviados || {}
});
const retrato = () => JSON.stringify(E.equipos.map(retratoDe));

function restaurar(snap){
  const d = JSON.parse(snap);
  const equipos = Array.isArray(d) ? d : (Array.isArray(d.equipos) ? d.equipos : null);
  if(equipos && equipos.length){
    E.equipos = equipos;
    if(d && d.equipoActual) E.equipoActual = d.equipoActual;
  }
  fijarActivo();
  // mesActual queda como está: qué mes mirás es navegación, no un cambio que deshacer.
}
function recalcularSucio(){ sucio = instantanea !== ultimoGuardado; }

// El guardado es de todo junto, pero conviene saber de quién es el cambio.
function equiposConCambios(){
  let antes;
  try{ antes = JSON.parse(ultimoGuardado || "[]"); }catch(e){ return []; }
  if(!Array.isArray(antes)) return [];
  const previos = {};
  antes.forEach(t => { const o = JSON.parse(t); previos[o.id] = t; });
  return E.equipos.filter(t => retratoDe(t) !== previos[t.id]).map(t => t.nombre);
}

function memoria(){
  try{
    sessionStorage.setItem("megafonia:undo", JSON.stringify(pilaUndo));
    sessionStorage.setItem("megafonia:redo", JSON.stringify(pilaRedo));
    sessionStorage.setItem("megafonia:base", ultimoGuardado);
  }catch(e){}   // ventana privada o almacenamiento bloqueado: el historial vive solo en memoria
}
function recordarSesion(){
  try{
    pilaUndo = JSON.parse(sessionStorage.getItem("megafonia:undo") || "[]");
    pilaRedo = JSON.parse(sessionStorage.getItem("megafonia:redo") || "[]");
    const base = sessionStorage.getItem("megafonia:base");
    if(base) ultimoGuardado = base;
  }catch(e){ pilaUndo = []; pilaRedo = []; }
}

// Se llama DESPUÉS de tocar el estado: `instantanea` todavía guarda cómo estaba antes.
// El visor corre la app en un marco que no deja abrir diálogos del navegador:
// confirm() devuelve "no" siempre. Así que se confirma con un segundo toque.
let porConfirmar = null, relojConfirmar = null;
function confirmado(clave){
  if(porConfirmar === clave){
    porConfirmar = null; clearTimeout(relojConfirmar);
    return true;
  }
  porConfirmar = clave;
  clearTimeout(relojConfirmar);
  relojConfirmar = setTimeout(() => { porConfirmar = null; render(); }, 5000);
  render();
  return false;
}
const esperando = clave => porConfirmar === clave;

function marcarSucio(){
  pilaUndo.push(instantanea);
  if(pilaUndo.length > TOPE_HISTORIAL) pilaUndo.shift();
  pilaRedo = [];
  instantanea = retrato();
  recalcularSucio();
  memoria();
}

function deshacer(){
  if(soloLectura || !pilaUndo.length) return brindis("No hay nada que deshacer.");
  pilaRedo.push(instantanea);
  instantanea = pilaUndo.pop();
  restaurar(instantanea);
  recalcularSucio(); memoria(); render();
  brindis(sucio ? "Cambio deshecho" : "Volviste a lo último guardado");
}
function rehacer(){
  if(soloLectura || !pilaRedo.length) return brindis("No hay nada que rehacer.");
  pilaUndo.push(instantanea);
  instantanea = pilaRedo.pop();
  restaurar(instantanea);
  recalcularSucio(); memoria(); render();
  brindis("Cambio rehecho");
}

/* ═══ Interacción ══════════════════════════════════════════════════ */
function brindis(txt){
  const b = $("#brindis"); if(!b) return;
  b.textContent = txt; b.classList.add("visible");
  clearTimeout(brindis._t);
  brindis._t = setTimeout(() => b.classList.remove("visible"), 2600);
}

document.addEventListener("click", ev => {
  const sum = ev.target.closest("details.avisos > summary");
  if(sum){
    avisosAbiertos = !sum.parentElement.open;     // el clic lo va a invertir
    try{ localStorage.setItem("megafonia:avisos", avisosAbiertos ? "1" : "0"); }catch(e){}
    document.querySelectorAll("details.avisos").forEach(d => {
      if(d !== sum.parentElement) d.open = avisosAbiertos;   // que los dos vayan juntos
    });
    return;
  }
  const t = ev.target.closest("button");
  if(!t) return;

  if(t.dataset.vista){ vista = t.dataset.vista; render(); return; }

  if(t.dataset.salto){
    const {anio, mes} = mesVigente();
    const d = new Date(Date.UTC(anio, mes + Number(t.dataset.salto), 1));
    E.mesActual = claveMes(d.getUTCFullYear(), d.getUTCMonth());
    render(); return;
  }
  if(t.id === "btn-refrescar"){
    if(sucio && !soloLectura && !confirmado("recargar"))
      return brindis("Tenés cambios sin guardar. Tocá otra vez para recargar igual.");
    publicando = true;              // que no salte además el aviso del navegador
    location.reload();
    return;
  }
  if(t.id === "btn-deshacer") return deshacer();
  if(t.id === "btn-rehacer") return rehacer();
  if(t.id === "btn-regla") return agregarRestriccionManual();
  if(t.dataset.regla !== undefined){
    const {anio, mes} = mesVigente();
    restriccionesDe(claveMes(anio, mes)).splice(Number(t.dataset.regla), 1);
    marcarSucio(); render(); return;
  }
  if(t.id === "btn-generar") return generar();
  if(t.id === "btn-guardar") return guardar();

  if(t.dataset.msj){ tipoMsj = t.dataset.msj; render(); return; }
  if(t.dataset.escribir){
    const p = persona(t.dataset.escribir), tel = p && telDe(p);
    if(!tel) return brindis("Esa persona no tiene un teléfono cargado.");
    const prox = proximaFecha();
    const saludo = "Hola " + p.nombre.split(" ")[0] + "! ";
    const texto = prox
      ? saludo + "Te toca el " + DIAS_SEM[prox.f.dow].toLowerCase() + " " + prox.f.dia +
        " de " + MESES[prox.mes] + " en " + AC.nombre.toLowerCase() + ". ¿Podés?"
      : saludo + "Te escribo por el planning de " + AC.nombre.toLowerCase() + ".";
    window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(texto), "_blank", "noopener");
    return;
  }
  if(t.id === "btn-ayuda-turno"){ ayudaTurno = !ayudaTurno; render(); return; }
  if(t.id === "btn-borrar-equipo"){
    if(E.equipos.length === 1) return brindis("Tiene que quedar al menos un equipo.");
    if(!confirmado("equipo"))
      return brindis("Tocá otra vez para borrar «" + AC.nombre + "» con todo lo suyo.");
    E.equipos = E.equipos.filter(t => t.id !== AC.id);
    E.equipoActual = E.equipos[0].id;
    try{ localStorage.setItem("megafonia:equipo", E.equipoActual); }catch(e){}
    fijarActivo(); marcarSucio(); render();
    return brindis("Equipo borrado");
  }
  if(t.dataset.paleta){
    paletaImagen = t.dataset.paleta;
    try{ localStorage.setItem("megafonia:paleta", paletaImagen); }catch(e){}
    render(); return;
  }
  if(t.dataset.meses){
    mesesImagen = Number(t.dataset.meses);
    try{ localStorage.setItem("megafonia:meses", mesesImagen); }catch(e){}
    render(); return;
  }
  if(t.id === "btn-copiar-img") return copiarImagen();
  if(t.id === "btn-imagen") return descargarImagen();
  if(t.id === "btn-exportar") return exportarDatos();
  if(t.id === "btn-copiar" || t.id === "btn-wa"){
    const txt = $("#area-msj").value;
    if(t.id === "btn-wa")
      window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener");
    else copiar(txt);
    if(tipoMsj === "planning" && !soloLectura){   // esto pasa a ser el punto de comparación
      marcarComoEnviado(); marcarSucio(); render();
    }
    return;
  }
  
  if(t.dataset.diaSemana !== undefined){
    const d = Number(t.dataset.diaSemana);
    AC.config.dias = AC.config.dias.includes(d)
      ? AC.config.dias.filter(x => x !== d) : AC.config.dias.concat(d).sort();
    marcarSucio(); render(); return;
  }
  if(t.id === "btn-sumar-puesto"){
    let n = PUESTOS.length + 1, id;
    do { id = "puesto-" + n++; } while(PUESTOS.some(x => x.id === id));
    PUESTOS.push({id:id, label:"Puesto nuevo", emoji:"•", cupo:1,
                  color:PALETA_PUESTOS[PUESTOS.length % PALETA_PUESTOS.length]});
    Object.values(AC.plannings).forEach(pl => pl.fechas.forEach(f => { f.puestos[id] = [null]; }));
    marcarSucio(); render();
    const campos = document.querySelectorAll(".puesto-cfg .rotulo");
    const ultimo = campos[campos.length-1];
    if(ultimo){ ultimo.focus(); ultimo.select(); }
    return;
  }
  if(t.dataset.borrarPuesto !== undefined){
    const i = Number(t.dataset.borrarPuesto), pu = PUESTOS[i];
    if(PUESTOS.length === 1) return brindis("Tiene que quedar al menos un puesto.");
    if(!confirmado("puesto:" + pu.id))
      return brindis("Tocá otra vez para quitar «" + pu.label + "» de todas las fechas.");
    PUESTOS.splice(i, 1);
    Object.values(AC.plannings).forEach(pl => pl.fechas.forEach(f => { delete f.puestos[pu.id]; }));
    AC.gente.forEach(p => { p.puestos = p.puestos.filter(x => x !== pu.id); });
    marcarSucio(); render();
    return;
  }
  if(t.id === "btn-sumar"){
    let n = 1, id;
    do { id = "persona-" + n++; } while(persona(id));
    AC.gente.push({id:id, nombre:"Nombre y apellido", puestos:PUESTOS.map(p => p.id), activo:true});
    marcarSucio(); render();
    const inputs = document.querySelectorAll(".persona input.nombre");
    const ultimo = inputs[inputs.length-1];
    if(ultimo){ ultimo.focus(); ultimo.select(); }
    return;
  }

  const fila = t.closest(".persona");
  if(!fila) return;
  const p = persona(fila.dataset.id); if(!p) return;

  if(t.dataset.puesto){
    p.puestos = p.puestos.includes(t.dataset.puesto)
      ? p.puestos.filter(x => x !== t.dataset.puesto) : p.puestos.concat(t.dataset.puesto);
    marcarSucio(); render(); return;
  }
  if(t.dataset.accion === "activo"){ p.activo = !p.activo; marcarSucio(); render(); return; }
  if(t.dataset.accion === "borrar"){
    if(!confirmado("persona:" + p.id))
      return brindis("Tocá otra vez para sacar a " + p.nombre + " del equipo.");
    AC.gente = AC.gente.filter(x => x.id !== p.id);
    Object.values(AC.plannings).forEach(pl => pl.fechas.forEach(f =>
      Object.keys(f.puestos).forEach(k =>
        f.puestos[k] = f.puestos[k].map(id => id === p.id ? null : id))));
    marcarSucio(); render();
  }
});

document.addEventListener("change", ev => {
  const el = ev.target;

  if(el.id === "sel-equipo"){
    if(el.value === "__nuevo"){
      const nombre = (prompt("¿Cómo se llama el equipo nuevo?", "Escuela Sabática") || "").trim();
      if(!nombre){ render(); return; }               // cancelaste: vuelve al que estaba
      let n = E.equipos.length + 1, id;
      do { id = "equipo-" + n++; } while(E.equipos.some(t => t.id === id));
      E.equipos.push({id:id, nombre:nombre, puestos:[], gente:[],
                      config:{dias:AC.config.dias.slice(), tardeExclusiva:false},
                      plannings:{}, notas:{}, restricciones:{}, enviados:{}});
      E.equipoActual = id;
      try{ localStorage.setItem("megafonia:equipo", id); }catch(e){}
      fijarActivo(); marcarSucio(); render();
      brindis("Cargá su gente y sus puestos en la pestaña Equipo");
      return;
    }
    E.equipoActual = el.value;
    try{ localStorage.setItem("megafonia:equipo", el.value); }catch(e){}
    fijarActivo(); render();
    return;                                          // cambiar de equipo no es un cambio que guardar
  }
  if(el.id === "archivo-datos"){
    if(el.files && el.files[0]) importarDatos(el.files[0]);
    el.value = "";                       // así se puede volver a elegir el mismo archivo
    return;
  }
  if(el.classList.contains("asig")){
    const {anio, mes} = mesVigente();
    const plan = AC.plannings[claveMes(anio, mes)];
    const fecha = plan.fechas.find(f => f.dia === Number(el.dataset.dia));
    fecha.puestos[el.dataset.puesto][Number(el.dataset.idx)] = el.value || null;
    marcarSucio(); render(); return;
  }
  if(el.id === "tarde-excl"){ AC.config.tardeExclusiva = el.checked; marcarSucio(); render(); return; }
  if(el.dataset.campo === "tel" || el.dataset.campo === "email"){
    const p = persona(el.closest(".persona").dataset.id);
    if(p && (p[el.dataset.campo] || "") !== el.value){
      p[el.dataset.campo] = el.value.trim(); marcarSucio(); render();
    }
    return;
  }
  if(el.dataset.campo === "nombre-equipo"){
    const nombre = el.value.trim() || "Equipo";
    if(AC.nombre !== nombre){ AC.nombre = nombre; marcarSucio(); render(); }
    return;
  }
  if(el.dataset.campo === "nombre" && retrato() !== instantanea) marcarSucio();
  const cfg = el.closest && el.closest(".puesto-cfg");
  if(cfg){
    const pu = PUESTOS[Number(cfg.dataset.puestoIdx)];
    if(!pu) return;
    if(el.dataset.campo === "color"){ pu.color = el.value; marcarSucio(); render(); return; }
    if(el.dataset.campo === "otro-turno"){
      pu.otroTurno = el.checked; marcarSucio(); render(); return;
    }
    if(el.dataset.campo === "cupo"){
      const n = Math.max(1, Math.min(6, Number(el.value) || 1));
      pu.cupo = n;
      // Las fechas ya guardadas se ajustan al cupo nuevo, sin perder lo asignado.
      Object.values(AC.plannings).forEach(pl => pl.fechas.forEach(f => {
        const hay = f.puestos[pu.id] || [];
        f.puestos[pu.id] = Array.from({length:n}, (_, i) => hay[i] || null);
      }));
      marcarSucio(); render(); return;
    }
    if(el.dataset.campo === "puesto-nombre" && pu.label !== el.value){
      pu.label = el.value || "Sin nombre"; marcarSucio(); render(); return;
    }
  }
});

document.addEventListener("input", ev => {
  // Igual que el nombre de una persona: el rótulo del puesto se guarda al salir

  if(ev.target.dataset.campo === "puesto-nombre"){

document.addEventListener("keydown", ev => {
  if(!(ev.metaKey || ev.ctrlKey) || ev.key.toLowerCase() !== "z") return;
  const foco = document.activeElement;
  if(foco && /^(INPUT|TEXTAREA)$/.test(foco.tagName)) return;  // dejá que el campo maneje su propio undo
  ev.preventDefault();
  (ev.shiftKey ? rehacer : deshacer)();
});

let publicando = false;
window.addEventListener("beforeunload", ev => {

async function copiar(txt){
  try{
    await navigator.clipboard.writeText(txt);
    brindis("Mensaje copiado");
  }catch(e){
    const ta = $("#area-msj");
    if(ta){ ta.focus(); ta.select(); }
    brindis("Copialo con Ctrl+C / Cmd+C");
  }
}

/* ═══ La base ══════════════════════════════════════════════════════ */

const BASE_URL = "https://iaapvgbhyneboijbgrxl.supabase.co";
const BASE_KEY = "sb_publishable_TvJyNBoPG6BlXNk2oFBfcw_LxF8Yerd";
const cabeceras = {
  "apikey": BASE_KEY,
  "Authorization": "Bearer " + BASE_KEY,
  "Content-Type": "application/json"
};
let selloBase = null;

async function leerBase(){
  const r = await fetch(BASE_URL + "/rest/v1/planning?id=eq.1&select=datos,actualizado",
                        {headers: cabeceras, cache: "no-store"});
  if(!r.ok) throw new Error("La base respondió " + r.status);
  const filas = await r.json();
  if(!filas.length) throw new Error("Falta la fila del planning en la base.");
  selloBase = filas[0].actualizado;
  return filas[0].datos || {};
}

async function escribirBase(){
  const cuerpo = {
    equipos: E.equipos.map(t => Object.assign({}, t, {plannings: conDatos(t.plannings)})),
    equipoActual: E.equipoActual,
    mesActual: E.mesActual
  };
  const r = await fetch(BASE_URL + "/rest/v1/planning?id=eq.1", {
    method: "PATCH",
    headers: Object.assign({}, cabeceras, {"Prefer": "return=representation"}),
    body: JSON.stringify({datos: cuerpo, actualizado: new Date().toISOString()})
  });
  if(!r.ok) throw new Error("la base rechazó el guardado (" + r.status + ")");
  const filas = await r.json();
  if(filas && filas[0]) selloBase = filas[0].actualizado;
}

// Si otro dispositivo guarda, se trae solo en vez de quedar desactualizado.
function vigilarCambios(){
  setInterval(async () => {
    if(document.hidden || publicando) return;
    try{
      const r = await fetch(BASE_URL + "/rest/v1/planning?id=eq.1&select=actualizado",
                            {headers: cabeceras, cache: "no-store"});
      if(!r.ok) return;
      const filas = await r.json();
      const sello = filas.length ? filas[0].actualizado : null;
      if(!sello || !selloBase || sello === selloBase) return;
      selloBase = sello;
      if(sucio) return brindis("Otro dispositivo guardó cambios. Guardá lo tuyo y recargá.");
      const datos = await leerBase();
      if(datos && Array.isArray(datos.equipos) && datos.equipos.length){
        E.equipos = datos.equipos; fijarActivo();
        instantanea = ultimoGuardado = retrato();
        recalcularSucio(); render();
        brindis("Traído lo que guardaron desde otro lado");
      }
    }catch(e){}   // sin conexión: se reintenta en el próximo giro
  }, 20000);
}

// El visor de artifacts no permite descargas directas, pero un archivo local sí.
function bajarArchivo(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportarDatos(){
  const json = JSON.stringify({equipos:E.equipos, equipoActual:E.equipoActual}, null, 2);
  const nombre = archivoDe(AC.nombre) + "-datos.json";
  bajarArchivo(new Blob([json], {type:"application/json"}), nombre);
  brindis("Datos exportados");
}

function importarDatos(archivo){
  const lector = new FileReader();
  lector.onload = () => {
    let d;
    try{ d = JSON.parse(lector.result); }
    catch(e){ return brindis("Ese archivo no es un JSON válido."); }

    // Acepta tanto un respaldo nuevo (varios equipos) como uno viejo (uno solo).
    let equipos = null;
    if(Array.isArray(d.equipos) && d.equipos.length) equipos = d.equipos;
    else if(Array.isArray(d.equipo) && d.equipo.length)
      equipos = [{id:"equipo-1", nombre:"Equipo", puestos:d.puestos || AC.puestos,
                  gente:d.equipo, config:d.config || AC.config,
                  plannings:d.plannings || {}, notas:d.notas || {},
                  restricciones:d.restricciones || {}, enviados:d.enviados || {}}];
    if(!equipos) return brindis("Ese archivo no tiene ningún equipo adentro.");

    const cuantos = equipos.length === 1
      ? equipos[0].gente.length + " personas"
      : equipos.length + " equipos";
    brindis("Importados " + cuantos + ". Si no era esto, deshacelo con la flecha.");
    restaurar(JSON.stringify({equipos:equipos, equipoActual:equipos[0].id}));
    marcarSucio(); render();
    brindis("Datos importados: tocá Guardar para conservarlos");
  };
  lector.onerror = () => brindis("No se pudo leer el archivo.");
  lector.readAsText(archivo);
}


async function guardar(){
  if(soloLectura) return;
  const btn = $("#btn-guardar");
  if(btn){ btn.disabled = true; btn.textContent = "Guardando…"; }
  publicando = true;
  try{
    await escribirBase();
    ultimoGuardado = instantanea = retrato();
    sucio = false; publicando = false; memoria(); render();
    brindis("Guardado");
  }catch(err){
    publicando = false;
    if(btn){ btn.disabled = false; btn.textContent = "Guardar"; }
    brindis("No se pudo guardar: " + (err && err.message ? err.message : "revisá la conexión"));
  }
}

/* ═══ Arranque ═════════════════════════════════════════════════════ */

arrancar();

async function arrancar(){
  try{
    const datos = await leerBase();
    if(datos && Array.isArray(datos.equipos) && datos.equipos.length) E = datos;
  }catch(err){
    montarRaiz();
    RAIZ.innerHTML = '<div class="fallo"><h1>No se pudo cargar el planning</h1>' +
      '<p>' + esc(err && err.message ? err.message : "Sin conexión con la base.") + '</p>' +
      '<p class="chico">Revisá la conexión y recargá. Los datos están a salvo en la base.</p></div>';
    return;
  }
  fijarActivo();
  mesVigente();
  instantanea = ultimoGuardado = retrato();
  recordarSesion();
  recalcularSucio();
  montarRaiz();
  render();
  vigilarCambios();
}
